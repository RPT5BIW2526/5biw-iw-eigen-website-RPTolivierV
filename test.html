<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Search Example</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0fdf0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    form {
      display: flex;
      gap: 0.5em;
    }

    input[type="search"] {
      padding: 0.5em 1em;
      font-size: 1rem;
      border: 2px solid #ccc;
      border-radius: 5px;
      width: 300px;
    }

    button {
      padding: 0.5em 1em;
      font-size: 1rem;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <form action="/search" method="GET">
    <input type="search" name="q" placeholder="Search..." value="Lyrica" />
    <button type="submit">Search</button>
  </form>
</body>
</html>
